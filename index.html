<!DOCTYPE html>
< lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MATRIX // GLOBAL TERMINAL CHAT</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<>

  <canvas id="matrix-canvas"></canvas>

  <!-- Kick / Ban Fullscreen Overlay -->
  <div id="kick-ban-screen">
    <h1 id="kb-title">YOU GOT KICKED</h1>
    <p id="kb-reason">reason 'No reason'</p>
    <button class="btn btn-danger" id="kb-rejoin-btn">RECONNECT / REGISTER AGAIN</button>
  </div>

  <div class="app-shell">
    <!-- LEFT SIDEBAR: ONLINE USERS -->
    <aside class="panel sidebar-left" id="left-sidebar">
      <div class="side-title">
        <span>ONLINE (<span id="online-count">0</span>)</span>
        <button class="icon-btn mobile-only" onclick="toggleSidebars('left')">✖</button>
      </div>
      <div class="scroll-list" id="online-list"></div>
    </aside>

    <!-- CENTER TERMINAL -->
    <main class="panel center-terminal">
      <div class="header">
        <div class="header-left">
          <button class="icon-btn mobile-only" onclick="toggleSidebars('left')">👥</button>
          <span class="status-dot"></span>
          <span id="room-header-title">Chat</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="theme-btn" title="Switch Theme">🎨</button>
          <button class="icon-btn" id="mute-btn" title="Mute/Unmute">🔊</button>
          <button class="icon-btn mobile-only" onclick="toggleSidebars('right')">💬</button>
        </div>
      </div>

      <!-- Global Pinned Announcement -->
      <div id="announcement-banner">
        <span id="announcement-text"></span>
        <button class="icon-btn" id="clear-announce-btn" style="display:none;">✖</button>
      </div>

      <!-- AUTH SCREEN -->
      <div id="auth-screen">
        <div id="auth-prompt">Initializing terminal...</div>
        <div id="auth-error" style="color:#ff3b3b; font-size:0.85rem; min-height:18px;"></div>
        <div class="cmd-wrap">
          <span>&gt;</span>
          <input type="text" id="auth-input" placeholder="register (password)" autocomplete="off" />
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <button class="btn" id="auth-submit-btn">EXECUTE</button>
          <button class="btn btn-danger" id="forget-btn" style="display:none;">FORGET PASSWORD</button>
        </div>
      </div>

      <!-- CHAT SCREEN -->
      <div id="chat-screen">
        <div id="chat-box"></div>
        <div id="typing-bar"></div>

        <!-- GIF Search Drawer -->
        <div id="gif-drawer">
          <div style="display:flex; gap:6px;">
            <input type="text" id="gif-search-input" class="modal-input" placeholder="Search GIFs..." />
            <button class="btn" id="gif-search-btn">GO</button>
            <button class="btn btn-danger" onclick="document.getElementById('gif-drawer').style.display='none'">✖</button>
          </div>
          <div class="gif-grid" id="gif-results"></div>
        </div>

        <!-- Reply Preview Bar -->
        <div id="reply-bar">
          <span id="reply-preview-text"></span>
          <button class="icon-btn" id="cancel-reply-btn">✖</button>
        </div>

        <!-- Bottom Message Controls -->
        <div class="controls">
          <label class="tool-btn" title="Upload Photo or Video">
            📁
            <input type="file" id="media-input" accept="image/*,video/*" hidden />
          </label>
          <button class="tool-btn" id="toggle-gif-btn">GIF</button>
          <input type="text" id="msg-input" placeholder="Type message or emoji..." autocomplete="off" />
          <button class="btn" id="send-btn">SEND</button>
        </div>
      </div>
    </main>

    <!-- RIGHT SIDEBAR: ROOMS -->
    <aside class="panel sidebar-right" id="right-sidebar">
      <div class="side-title">
        <span>CURRENT CHAT</span>
        <button class="icon-btn mobile-only" onclick="toggleSidebars('right')">✖</button>
      </div>
      <div class="scroll-list" id="room-list"></div>
      <button class="btn" id="open-create-room-btn" style="margin-top:10px; width:100%;">+ Add new Chat</button>
    </aside>
  </div>

  <!-- MESSAGE / USER ACTION MODAL -->
  <div class="modal-backdrop" id="action-modal">
    <div class="modal-box">
      <h3 id="action-modal-title">OPTIONS</h3>
      <button class="btn" id="act-reply-btn">↩ REPLY TO MESSAGE</button>
      <button class="btn" id="act-announce-btn">📢 ANNOUNCE TO EVERYONE</button>
      <button class="btn btn-danger" id="act-delete-btn">🗑 DELETE MESSAGE</button>
      <button class="btn btn-danger" id="act-kick-btn">👢 KICK USER (OWNER)</button>
      <button class="btn btn-danger" id="act-ban-btn">⛔ BAN USER (OWNER)</button>
      <button class="btn" onclick="closeModals()">CANCEL</button>
    </div>
  </div>

  <!-- CREATE / EDIT / DELETE ROOM MODAL -->
  <div class="modal-backdrop" id="room-modal">
    <div class="modal-box">
      <h3 id="room-modal-title">ADD NEW CHAT</h3>
      <input type="text" id="room-name-input" class="modal-input" placeholder="Chat name..." />
      <select id="room-type-select" class="modal-input">
        <option value="public">Chat (Anyone can join)</option>
        <option value="group">Group Chat (Pick allowed members)</option>
      </select>
      <div id="group-members-box" style="display:none;">
        <div style="font-size:0.78rem; margin-bottom:5px;">Select registered people allowed to join:</div>
        <div class="member-check-list" id="member-checkboxes"></div>
      </div>
      <button class="btn" id="save-room-btn">SAVE CHAT</button>
      <button class="btn btn-danger" id="delete-room-btn" style="display:none;">🗑 DELETE ROOM</button>
      <button class="btn" onclick="closeModals()">CANCEL</button>
    </div>
  </div>

  <!-- OWNER KICK / BAN REASON MODAL -->
  <div class="modal-backdrop" id="mod-reason-modal">
    <div class="modal-box">
      <h3 id="mod-reason-title">KICK USER</h3>
      <p id="mod-reason-desc" style="font-size:0.8rem;"></p>
      <input type="text" id="mod-reason-input" class="modal-input" placeholder="Type reason..." />
      <button class="btn btn-danger" id="confirm-mod-btn">CONFIRM</button>
      <button class="btn" onclick="closeModals()">CANCEL</button>
    </div>
  </div>

  <script>
    /* =====================================================================
       >>> PASTE YOUR FIREBASE CONFIG HERE <<<
    ===================================================================== */
    const firebaseConfig = {
  apiKey: "AIzaSyC0ZT0DvjUIFggMJ1yoTEPL9zAilqFYZJw",
  authDomain: "vayuchat-e79fe.firebaseapp.com",
  databaseURL: "https://vayuchat-e79fe-default-rtdb.firebaseio.com",
  projectId: "vayuchat-e79fe",
  storageBucket: "vayuchat-e79fe.firebasestorage.app",
  messagingSenderId: "853280894353",
  appId: "1:853280894353:web:1bd6f4d15608430a98be30"
};

    const OWNER_USERNAME = "Vayu24";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    /* =====================================================================
       1. MATRIX RAIN & AUDIO
    ===================================================================== */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const fontSize = 15;
    let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
    const themes = ['', 'theme-purple', 'theme-blue'];
    let themeIndex = 0;
    let isMuted = false;

    function getPrimaryColor() {
      return getComputedStyle(document.body).getPropertyValue('--primary').trim() || '#00ff41';
    }

    setInterval(() => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = getPrimaryColor();
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(Math.random() > 0.5 ? '1' : '0', i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 45);

    function playBeep() {
      if (isMuted) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 680;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    document.getElementById('theme-btn').onclick = () => {
      themeIndex = (themeIndex + 1) % themes.length;
      document.body.className = themes[themeIndex];
    };

    document.getElementById('mute-btn').onclick = (e) => {
      isMuted = !isMuted;
      e.target.textContent = isMuted ? '🔇' : '🔊';
    };

    function toggleSidebars(side) {
      if (side === 'left') {
        document.getElementById('left-sidebar').classList.toggle('open');
        document.getElementById('right-sidebar').classList.remove('open');
      } else {
        document.getElementById('right-sidebar').classList.toggle('open');
        document.getElementById('left-sidebar').classList.remove('open');
      }
    }

    function closeModals() {
      document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none');
    }

    /* =====================================================================
       2. STATE & HELPERS
    ===================================================================== */
    const LOCAL_KEYS = { PASS: 'vayu_pass', NAME: 'vayu_name' };
    let currentUser = null;
    let currentRoomId = 'global';
    let roomsCache = {};
    let usersCache = {};
    let replyTarget = null;
    let activeMessageListener = null;
    let activeTypingListener = null;
    let typingTimeout = null;

    function isOwnerUser(name) {
      return name && name.toLowerCase() === OWNER_USERNAME.toLowerCase();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatUserHTML(name) {
      if (isOwnerUser(name)) {
        return `${escapeHtml(name)} <span class="owner-badge">OWNER</span>`;
      }
      return escapeHtml(name);
    }

    function getRandomColorForName(name) {
      const palette = ['#00ff41', '#00e5ff', '#ff6bcb', '#ffd166', '#a78bfa', '#ff8c42', '#38bdf8', '#4ade80'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return palette[Math.abs(hash) % palette.length];
    }

    /* =====================================================================
       3. AUTHENTICATION
    ===================================================================== */
    let authStage = 'REGISTER';
    const authPrompt = document.getElementById('auth-prompt');
    const authError = document.getElementById('auth-error');
    const authInput = document.getElementById('auth-input');
    const forgetBtn = document.getElementById('forget-btn');

    function initAuth() {
      const savedPass = localStorage.getItem(LOCAL_KEYS.PASS);
      authError.textContent = '';
      authInput.value = '';
      if (!savedPass) {
        authStage = 'REGISTER';
        authPrompt.innerHTML = 'SYSTEM READY.<br>Type <b>register (password)</b> to create your account.';
        authInput.placeholder = 'register (password)';
        forgetBtn.style.display = 'none';
      } else {
        authStage = 'LOGIN';
        authPrompt.innerHTML = 'ACCOUNT DETECTED.<br>Type <b>login (password)</b> to enter.';
        authInput.placeholder = 'login (password)';
        forgetBtn.style.display = 'inline-block';
      }
    }

    async function handleAuth() {
      const raw = authInput.value.trim();
      authError.textContent = '';
      if (!raw) return;

      if (authStage === 'REGISTER') {
        const match = raw.match(/^register\s+\(?([^)]+)\)?$/i);
        if (!match || !match[1].trim()) {
          authError.textContent = 'Use format: register (yourpassword)';
          return;
        }
        localStorage.setItem(LOCAL_KEYS.PASS, match[1].trim());
        authStage = 'SET_NAME';
        authInput.value = '';
        authInput.placeholder = 'Enter permanent name...';
        forgetBtn.style.display = 'none';
        authPrompt.innerHTML = 'PASSWORD SAVED.<br>Enter your <b>PERMANENT NAME</b> (unique):';
      } else if (authStage === 'LOGIN') {
        const match = raw.match(/^login\s+\(?([^)]+)\)?$/i);
        if (!match || !match[1].trim()) {
          authError.textContent = 'Use format: login (yourpassword)';
          return;
        }
        if (match[1].trim() !== localStorage.getItem(LOCAL_KEYS.PASS)) {
          authError.textContent = 'ACCESS DENIED: Wrong password.';
          return;
        }
        const savedName = localStorage.getItem(LOCAL_KEYS.NAME);
        if (!savedName) {
          authStage = 'SET_NAME';
          authInput.value = '';
          forgetBtn.style.display = 'none';
          authPrompt.innerHTML = 'Enter your <b>PERMANENT NAME</b>:';
        } else {
          const snap = await db.ref('users/' + savedName.toLowerCase()).get();
          if (!snap.exists()) {
            await db.ref('users/' + savedName.toLowerCase()).set({ name: savedName });
          }
          startChatSession(savedName);
        }
      } else if (authStage === 'SET_NAME') {
        const cleanName = raw.replace(/[():.#$/\[\]]/g, '').trim();
        if (cleanName.length < 2) {
          authError.textContent = 'Name must be at least 2 characters.';
          return;
        }
        const key = cleanName.toLowerCase();
        const snap = await db.ref('users/' + key).get();
        if (snap.exists()) {
          authError.textContent = `Name "${cleanName}" is already taken! Choose another.`;
          return;
        }
        await db.ref('users/' + key).set({ name: cleanName, createdAt: Date.now() });
        localStorage.setItem(LOCAL_KEYS.NAME, cleanName);
        startChatSession(cleanName);
      }
    }

    forgetBtn.onclick = async () => {
      const oldName = localStorage.getItem(LOCAL_KEYS.NAME);
      if (oldName) {
        await db.ref('users/' + oldName.toLowerCase()).remove();
        await db.ref('online/' + oldName.toLowerCase()).remove();
      }
      localStorage.removeItem(LOCAL_KEYS.PASS);
      localStorage.removeItem(LOCAL_KEYS.NAME);
      initAuth();
    };

    document.getElementById('auth-submit-btn').onclick = handleAuth;
    authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });

    /* =====================================================================
       4. CHAT SESSION, ONLINE ROSTER & KICK/BAN LISTENER
    ===================================================================== */
    function startChatSession(username) {
      currentUser = username;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';

      const myKey = currentUser.toLowerCase();
      const onlineRef = db.ref('online/' + myKey);
      const color = getRandomColorForName(currentUser);

      db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
          onlineRef.onDisconnect().remove();
          onlineRef.set({ name: currentUser, color: color, joinedAt: Date.now() });
        }
      });

      db.ref('moderation/' + myKey).on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        const screen = document.getElementById('kick-ban-screen');
        document.getElementById('kb-title').textContent = data.type === 'ban' ? 'YOU GOT BANNED' : 'YOU GOT KICKED';
        document.getElementById('kb-reason').textContent = `reason '${data.reason || 'No reason given'}'`;
        screen.style.display = 'flex';

        onlineRef.remove();
        if (data.type === 'ban') {
          localStorage.removeItem(LOCAL_KEYS.PASS);
          localStorage.removeItem(LOCAL_KEYS.NAME);
        }

        document.getElementById('kb-rejoin-btn').onclick = async () => {
          await db.ref('moderation/' + myKey).remove();
          screen.style.display = 'none';
          if (data.type === 'ban') {
            currentUser = null;
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            initAuth();
          } else {
            onlineRef.set({ name: currentUser, color: color, joinedAt: Date.now() });
          }
        };
      });

      listenToUsersAndOnline();
      listenToRooms();
      listenToAnnouncement();
      switchRoom('global');
    }

    function listenToUsersAndOnline() {
      db.ref('users').on('value', (snap) => {
        usersCache = snap.val() || {};
      });

      db.ref('online').on('value', (snap) => {
        const onlineData = snap.val() || {};
        const listEl = document.getElementById('online-list');
        const entries = Object.values(onlineData);
        document.getElementById('online-count').textContent = entries.length;
        listEl.innerHTML = '';

        entries.forEach((u) => {
          const item = document.createElement('div');
          item.className = 'online-item';
          const initial = (u.name[0] || '?').toUpperCase();
          item.innerHTML = `
            <div class="avatar-circle" style="background:${u.color || '#00ff41'}">${initial}</div>
            <div style="font-size:0.85rem; font-weight:bold; overflow:hidden; text-overflow:ellipsis;">
              ${formatUserHTML(u.name)}
            </div>`;
          attachHoldHandler(item, () => openUserOrMessageMenu({ sender: u.name, isUserOnly: true }));
          listEl.appendChild(item);
        });
      });
    }

    /* =====================================================================
       5. ROOMS & GROUP CHAT MANAGEMENT
    ===================================================================== */
    function listenToRooms() {
      db.ref('rooms').on('value', (snap) => {
        roomsCache = snap.val() || {};
        renderRoomList();
        if (currentRoomId !== 'global') {
          const r = roomsCache[currentRoomId];
          if (!r || !canAccessRoom(r)) {
            switchRoom('global');
          } else {
            updateRoomHeader(r);
          }
        }
      });
    }

    function canAccessRoom(room) {
      if (!room || room.type !== 'group') return true;
      if (isOwnerUser(currentUser)) return true;
      if (room.creator && room.creator.toLowerCase() === currentUser.toLowerCase()) return true;
      return !!(room.allowed && room.allowed[currentUser.toLowerCase()]);
    }

    function getRoomDisplayName(roomId, room) {
      if (roomId === 'global' || !room) return 'Chat';
      return `${room.creator}'s Chat:${room.name}`;
    }

    function updateRoomHeader(room) {
      document.getElementById('room-header-title').textContent = getRoomDisplayName(currentRoomId, room);
    }

    function renderRoomList() {
      const listEl = document.getElementById('room-list');
      listEl.innerHTML = '';

      const globalDiv = document.createElement('div');
      globalDiv.className = 'room-item' + (currentRoomId === 'global' ? ' active' : '');
      globalDiv.innerHTML = `<div class="room-name">Chat</div><div class="room-meta">Public • Everyone</div>`;
      globalDiv.onclick = () => switchRoom('global');
      listEl.appendChild(globalDiv);

      Object.entries(roomsCache).forEach(([id, room]) => {
        if (!canAccessRoom(room)) return;
        const div = document.createElement('div');
        div.className = 'room-item' + (currentRoomId === id ? ' active' : '');
        div.innerHTML = `
          <div class="room-name">${escapeHtml(getRoomDisplayName(id, room))}</div>
          <div class="room-meta">${room.type === 'group' ? 'Group Chat' : 'Public Chat'}</div>`;
        div.onclick = () => switchRoom(id);

        const canManage = (room.creator && room.creator.toLowerCase() === currentUser.toLowerCase()) || isOwnerUser(currentUser);
        if (canManage) {
          attachHoldHandler(div, () => openRoomModal(id, room));
        }
        listEl.appendChild(div);
      });
    }

    function switchRoom(roomId) {
      currentRoomId = roomId;
      replyTarget = null;
      document.getElementById('reply-bar').style.display = 'none';
      updateRoomHeader(roomsCache[roomId]);
      renderRoomList();
      document.getElementById('right-sidebar').classList.remove('open');

      if (activeMessageListener) activeMessageListener.off();
      if (activeTypingListener) activeTypingListener.off();

      document.getElementById('chat-box').innerHTML = '';

      const msgsRef = db.ref('messages/' + roomId);
      activeMessageListener = msgsRef;
      msgsRef.limitToLast(100).on('value', (snap) => renderMessages(snap.val() || {}));

      const typingRef = db.ref('typing/' + roomId);
      activeTypingListener = typingRef;
      typingRef.on('value', (snap) => {
        const data = snap.val() || {};
        const typers = Object.values(data).filter(n => n.toLowerCase() !== currentUser.toLowerCase());
        document.getElementById('typing-bar').textContent = typers.length > 0 ? `${typers.join(', ')} typing...` : '';
      });
    }

    let editingRoomId = null;
    const roomTypeSelect = document.getElementById('room-type-select');
    const groupMembersBox = document.getElementById('group-members-box');

    roomTypeSelect.onchange = () => {
      groupMembersBox.style.display = roomTypeSelect.value === 'group' ? 'block' : 'none';
    };

    document.getElementById('open-create-room-btn').onclick = () => openRoomModal(null, null);

    function openRoomModal(roomId, room) {
      editingRoomId = roomId;
      document.getElementById('room-modal-title').textContent = roomId ? 'MANAGE CHAT' : 'ADD NEW CHAT';
      document.getElementById('room-name-input').value = room ? room.name : '';
      roomTypeSelect.value = room ? room.type : 'public';
      roomTypeSelect.disabled = !!roomId;
      groupMembersBox.style.display = roomTypeSelect.value === 'group' ? 'block' : 'none';
      document.getElementById('delete-room-btn').style.display = roomId ? 'block' : 'none';

      const checksEl = document.getElementById('member-checkboxes');
      checksEl.innerHTML = '';
      const allowedMap = (room && room.allowed) || {};
      Object.values(usersCache).forEach((u) => {
        if (u.name.toLowerCase() === currentUser.toLowerCase()) return;
        const key = u.name.toLowerCase();
        const checked = !!allowedMap[key] ? 'checked' : '';
        const lbl = document.createElement('label');
        lbl.innerHTML = `<input type="checkbox" value="${key}" ${checked} /> ${escapeHtml(u.name)}`;
        checksEl.appendChild(lbl);
      });

      document.getElementById('room-modal').style.display = 'flex';
    }

    document.getElementById('save-room-btn').onclick = async () => {
      const name = document.getElementById('room-name-input').value.trim();
      if (!name) return;

      const type = roomTypeSelect.value;
      const allowed = {};
      allowed[currentUser.toLowerCase()] = true;

      if (type === 'group') {
        document.querySelectorAll('#member-checkboxes input:checked').forEach((cb) => {
          allowed[cb.value] = true;
        });
      }

      if (editingRoomId) {
        await db.ref('rooms/' + editingRoomId).update({ name, allowed });
      } else {
        const newRef = db.ref('rooms').push();
        await newRef.set({
          name,
          type,
          creator: currentUser,
          allowed,
          createdAt: Date.now()
        });
        switchRoom(newRef.key);
      }
      closeModals();
    };

    document.getElementById('delete-room-btn').onclick = async () => {
      if (!editingRoomId) return;
      await db.ref('rooms/' + editingRoomId).remove();
      await db.ref('messages/' + editingRoomId).remove();
      await db.ref('typing/' + editingRoomId).remove();
      closeModals();
      switchRoom('global');
    };

    /* =====================================================================
       6. MESSAGES, ANNOUNCE & OWNER KICK / BAN
    ===================================================================== */
    let lastMsgCount = 0;

    function renderMessages(msgsObj) {
      const chatBox = document.getElementById('chat-box');
      const wasAtBottom = chatBox.scrollHeight - chatBox.scrollTop <= chatBox.clientHeight + 60;
      const entries = Object.entries(msgsObj);

      if (entries.length > lastMsgCount && lastMsgCount !== 0) playBeep();
      lastMsgCount = entries.length;

      chatBox.innerHTML = '';

      entries.forEach(([id, m]) => {
        const isMine = m.sender && m.sender.toLowerCase() === currentUser.toLowerCase();
        if (!isMine && !m.readed) {
          db.ref(`messages/${currentRoomId}/${id}/readed`).set(true);
        }

        const bubble = document.createElement('div');
        bubble.className = 'msg' + (isMine ? ' mine' : '');

        if (m.replyTo) {
          const q = document.createElement('div');
          q.className = 'reply-quote';
          q.textContent = `↩ (${m.replyTo.sender}): ${m.replyTo.text}`;
          bubble.appendChild(q);
        }

        const senderEl = document.createElement('div');
        senderEl.className = 'msg-sender';
        senderEl.innerHTML = `(${formatUserHTML(m.sender)})`;
        bubble.appendChild(senderEl);

        if (m.text) {
          const bodyEl = document.createElement('div');
          bodyEl.className = 'msg-body';
          bodyEl.textContent = m.text;
          bubble.appendChild(bodyEl);

          if (/^https?:\/\/.*\.gif(\?.*)?$/i.test(m.text.trim())) {
            const gif = document.createElement('img');
            gif.src = m.text.trim();
            gif.className = 'msg-media';
            bubble.appendChild(gif);
          }
        }

        if (m.mediaData) {
          if (m.mediaType && m.mediaType.startsWith('video/')) {
            const vid = document.createElement('video');
            vid.src = m.mediaData;
            vid.controls = true;
            vid.className = 'msg-media';
            bubble.appendChild(vid);
          } else {
            const img = document.createElement('img');
            img.src = m.mediaData;
            img.className = 'msg-media';
            bubble.appendChild(img);
          }
        }

        if (m.readed) {
          const readTag = document.createElement('span');
          readTag.className = 'read-tag';
          readTag.textContent = 'readed';
          bubble.appendChild(readTag);
        }

        attachHoldHandler(bubble, () => openUserOrMessageMenu({
          msgId: id,
          sender: m.sender,
          text: m.text || '[Media]',
          isMine
        }));

        chatBox.appendChild(bubble);
      });

      if (wasAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
    }

    function attachHoldHandler(element, callback) {
      let timer = null;
      const start = () => { timer = setTimeout(callback, 550); };
      const cancel = () => clearTimeout(timer);
      element.addEventListener('mousedown', start);
      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('mouseup', cancel);
      element.addEventListener('mouseleave', cancel);
      element.addEventListener('touchend', cancel);
    }

    function openUserOrMessageMenu(target) {
      const targetIsMe = target.sender.toLowerCase() === currentUser.toLowerCase();
      const amIOwner = isOwnerUser(currentUser);

      document.getElementById('action-modal-title').textContent = target.isUserOnly ? `USER: ${target.sender}` : `MESSAGE BY ${target.sender}`;
      const replyBtn = document.getElementById('act-reply-btn');
      const announceBtn = document.getElementById('act-announce-btn');
      const deleteBtn = document.getElementById('act-delete-btn');
      const kickBtn = document.getElementById('act-kick-btn');
      const banBtn = document.getElementById('act-ban-btn');

      replyBtn.style.display = (!target.isUserOnly && !targetIsMe) ? 'block' : 'none';
      announceBtn.style.display = !target.isUserOnly ? 'block' : 'none';
      deleteBtn.style.display = (!target.isUserOnly && targetIsMe) ? 'block' : 'none';
      kickBtn.style.display = (amIOwner && !targetIsMe) ? 'block' : 'none';
      banBtn.style.display = (amIOwner && !targetIsMe) ? 'block' : 'none';

      replyBtn.onclick = () => {
        replyTarget = { sender: target.sender, text: target.text };
        document.getElementById('reply-preview-text').textContent = `Replying to (${target.sender}): ${target.text}`;
        document.getElementById('reply-bar').style.display = 'flex';
        closeModals();
        document.getElementById('msg-input').focus();
      };

      announceBtn.onclick = async () => {
        await db.ref('announcement').set({
          sender: currentUser,
          text: `📢 [${target.sender}]: ${target.text}`,
          createdAt: Date.now()
        });
        closeModals();
      };

      deleteBtn.onclick = async () => {
        await db.ref(`messages/${currentRoomId}/${target.msgId}`).remove();
        closeModals();
      };

      kickBtn.onclick = () => openModReasonModal('kick', target.sender);
      banBtn.onclick = () => openModReasonModal('ban', target.sender);

      document.getElementById('action-modal').style.display = 'flex';
    }

    function openModReasonModal(type, targetUser) {
      closeModals();
      const title = document.getElementById('mod-reason-title');
      const desc = document.getElementById('mod-reason-desc');
      const input = document.getElementById('mod-reason-input');
      const confirmBtn = document.getElementById('confirm-mod-btn');

      title.textContent = type === 'ban' ? `⛔ BAN ${targetUser}` : `👢 KICK ${targetUser}`;
      desc.textContent = type === 'ban'
        ? `WARNING: Banning ${targetUser} will permanently delete ALL their messages, delete ALL chats they created, and forget their name.`
        : `Type the kick message that will pop up on ${targetUser}'s screen:`;
      input.value = '';
      document.getElementById('mod-reason-modal').style.display = 'flex';

      confirmBtn.onclick = async () => {
        const reason = input.value.trim() || (type === 'ban' ? 'Banned by Owner' : 'Kicked by Owner');
        if (type === 'ban') {
          const sure = confirm(`DANGER: Are you 100% sure you want to BAN "${targetUser}" and wipe all their messages and created chats?`);
          if (!sure) return;
          await executeOwnerBan(targetUser, reason);
        } else {
          await db.ref('moderation/' + targetUser.toLowerCase()).set({ type: 'kick', reason, at: Date.now() });
        }
        closeModals();
      };
    }

    async function executeOwnerBan(targetUser, reason) {
      const targetKey = targetUser.toLowerCase();
      await db.ref('moderation/' + targetKey).set({ type: 'ban', reason, at: Date.now() });
      await db.ref('users/' + targetKey).remove();
      await db.ref('online/' + targetKey).remove();

      const roomsSnap = await db.ref('rooms').get();
      for (const [rId, rData] of Object.entries(roomsSnap.val() || {})) {
        if (rData.creator && rData.creator.toLowerCase() === targetKey) {
          await db.ref('rooms/' + rId).remove();
          await db.ref('messages/' + rId).remove();
        }
      }

      const msgsSnap = await db.ref('messages').get();
      for (const [rId, roomMsgs] of Object.entries(msgsSnap.val() || {})) {
        for (const [mId, mData] of Object.entries(roomMsgs || {})) {
          if (mData.sender && mData.sender.toLowerCase() === targetKey) {
            await db.ref(`messages/${rId}/${mId}`).remove();
          }
        }
      }
    }

    function listenToAnnouncement() {
      db.ref('announcement').on('value', (snap) => {
        const data = snap.val();
        const banner = document.getElementById('announcement-banner');
        const clearBtn = document.getElementById('clear-announce-btn');
        if (!data || !data.text) {
          banner.style.display = 'none';
          return;
        }
        banner.style.display = 'flex';
        document.getElementById('announcement-text').textContent = data.text;
        clearBtn.style.display = (data.sender && data.sender.toLowerCase() === currentUser.toLowerCase()) ? 'inline-block' : 'none';
        clearBtn.onclick = () => db.ref('announcement').remove();
      });
    }

    /* =====================================================================
       7. SEND MESSAGES, TYPING, GIFS & MEDIA
    ===================================================================== */
    const msgInput = document.getElementById('msg-input');

    msgInput.addEventListener('input', () => {
      if (!currentUser) return;
      const myTypingRef = db.ref(`typing/${currentRoomId}/${currentUser.toLowerCase()}`);
      if (msgInput.value.trim().length > 0) {
        myTypingRef.set(currentUser);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => myTypingRef.remove(), 2500);
      } else {
        myTypingRef.remove();
      }
    });

    document.getElementById('cancel-reply-btn').onclick = () => {
      replyTarget = null;
      document.getElementById('reply-bar').style.display = 'none';
    };

    async function sendMessage(overrideText = null, mediaData = null, mediaType = null) {
      const text = overrideText !== null ? overrideText : msgInput.value.trim();
      if (!text && !mediaData) {
        if (replyTarget) {
          replyTarget = null;
          document.getElementById('reply-bar').style.display = 'none';
        }
        return;
      }

      const payload = {
        sender: currentUser,
        text: text,
        mediaData: mediaData,
        mediaType: mediaType,
        replyTo: replyTarget,
        readed: false,
        createdAt: Date.now()
      };

      msgInput.value = '';
      replyTarget = null;
      document.getElementById('reply-bar').style.display = 'none';
      db.ref(`typing/${currentRoomId}/${currentUser.toLowerCase()}`).remove();
      await db.ref('messages/' + currentRoomId).push(payload);
    }

    document.getElementById('send-btn').onclick = () => sendMessage();
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    document.getElementById('media-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 9 * 1024 * 1024) {
        alert('File must be under 3.5MB.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (evt) => {
        sendMessage(msgInput.value.trim(), evt.target.result, file.type);
        e.target.value = '';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('toggle-gif-btn').onclick = () => {
      const drawer = document.getElementById('gif-drawer');
      drawer.style.display = drawer.style.display === 'flex' ? 'none' : 'flex';
      if (drawer.style.display === 'flex' && !document.getElementById('gif-results').innerHTML) {
        searchGifs('hacker matrix');
      }
    };

    async function searchGifs(query) {
      const grid = document.getElementById('gif-results');
      grid.innerHTML = 'Loading GIFs...';
      try {
        const res = await fetch(`https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=LIVDSRZULELA&limit=12`);
        const data = await res.json();
        grid.innerHTML = '';
        (data.results || []).forEach((item) => {
          const url = item.media[0].tinygif.url;
          const img = document.createElement('img');
          img.src = url;
          img.onclick = () => {
            sendMessage(url);
            document.getElementById('gif-drawer').style.display = 'none';
          };
          grid.appendChild(img);
        });
      } catch (e) {
        grid.innerHTML = 'GIF search failed.';
      }
    }

    document.getElementById('gif-search-btn').onclick = () => {
      const q = document.getElementById('gif-search-input').value.trim();
      if (q) searchGifs(q);
    };

    initAuth();
    </script>
  <script src="addons.js?v=10"></script>
</body>
